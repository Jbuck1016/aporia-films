<!doctype html>
<html lang="en" data-page="projects">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects · Aporia Films</title>
  <meta name="description" content="Features, shorts and documentaries from Aporia Films, in development, in production and released.">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Projects · Aporia Films">
  <meta property="og:description" content="Features, shorts and documentaries from Aporia Films, in development, in production and released.">
  <meta property="og:url" content="https://aporia-films.vercel.app/projects">
  <meta property="og:image" content="https://aporia-films.vercel.app/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..500&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="preload" href="/site.json" as="fetch" crossorigin>
  <link rel="preload" href="/films.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script>document.documentElement.classList.add('js'); setTimeout(function () { document.documentElement.classList.add('data-ready'); }, 3000);</script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <a class="skip-link" href="#content">Skip to content</a>

  <!-- Nav and footer are rendered by app.js (renderChrome). This static copy is only the no-JavaScript fallback. -->
  <header class="nav" id="nav">
    <a class="nav-brand" href="/" aria-label="Aporia Films home"><img src="/assets/mark-bw-96.png" alt="" width="22" height="26"><span>Aporia Films</span></a>
    <nav aria-label="Sections">
      <ul class="nav-links">
        <li><a href="/#home">Home</a></li>
        <li><a href="/#projects">Projects</a></li>
        <li><a href="/#about">About</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="content" tabindex="-1">
    <header class="page-head">
      <div class="wrap reveal">
        <p class="label">Projects</p>
        <h1>All work.</h1>
        <p class="page-sub" data-site="projectsIntro"></p>
      </div>
    </header>

    <section class="section section--tight" aria-labelledby="films-title">
      <div class="wrap reveal">
        <h2 class="sr-only" id="films-title">Films</h2>
        <div class="filters" role="group" aria-label="Filter by status">
          <button class="chip" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="chip" type="button" data-filter="Released" aria-pressed="false">Released</button>
          <button class="chip" type="button" data-filter="In production" aria-pressed="false">In production</button>
          <button class="chip" type="button" data-filter="In development" aria-pressed="false">In development</button>
        </div>
        <ul class="grid grid--3" id="grid" data-all="true"></ul>
        <p class="grid-empty label" id="grid-empty" hidden>No titles in this category yet.</p>
        <noscript><p class="label">Turn on JavaScript to see our films.</p></noscript>
        <p class="grid-note label">More titles are added as they are announced.</p>
      </div>
    </section>
  </main>

  <footer class="footer label" id="footer">
    <span>© 2026 Aporia Films</span>
    <img src="/assets/mark-bw-96.png" alt="" width="19" height="22">
    <span>Los Angeles</span>
  </footer>
</body>
</html>
