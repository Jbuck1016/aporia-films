<!doctype html>
<html lang="en" data-page="contact">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Aporia Films</title>
  <meta name="description" content="Get in touch with Aporia Films, an independent production company in Los Angeles.">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Contact · Aporia Films">
  <meta property="og:description" content="Get in touch with Aporia Films, an independent production company in Los Angeles.">
  <meta property="og:url" content="https://aporia-films.vercel.app/contact">
  <meta property="og:image" content="https://aporia-films.vercel.app/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..500&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="preload" href="/site.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script>document.documentElement.classList.add('js'); setTimeout(function () { document.documentElement.classList.add('data-ready'); }, 3000);</script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <a class="skip-link" href="#content">Skip to content</a>

  <!-- Nav and footer are rendered by app.js (renderChrome). This static copy is only the no-JavaScript fallback. -->
  <header class="nav" id="nav">
    <a class="nav-brand" href="/" aria-label="Aporia Films home"><img src="/assets/mark-bw-96.png" alt="" width="22" height="26"><span>Aporia Films</span></a>
    <nav aria-label="Sections">
      <ul class="nav-links">
        <li><a href="/#home">Home</a></li>
        <li><a href="/#projects">Projects</a></li>
        <li><a href="/#about">About</a></li>
        <li><a href="/#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="content" tabindex="-1">
    <header class="page-head">
      <div class="wrap reveal">
        <p class="label">Contact</p>
        <h1>Get in touch.</h1>
      </div>
    </header>

    <section class="section section--tight" aria-label="Ways to reach us">
      <div class="wrap contact-grid reveal">
        <div>
          <ul class="contact-list" id="contact-list"></ul>
          <p class="label contact-place" data-site="location"></p>
          <ul class="socials" id="socials"></ul>
        </div>
        <form class="form" id="enquiry" novalidate>
          <div class="field">
            <label for="f-name">Name</label>
            <input id="f-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="f-email">Email</label>
            <input id="f-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="f-message">Message</label>
            <textarea id="f-message" name="message" rows="7" required></textarea>
          </div>
          <p class="form-error label" id="form-error" role="alert" hidden></p>
          <button class="btn btn--solid" type="submit">Send message</button>
          <p class="label form-note">Opens in your email app.</p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer label" id="footer">
    <span>© 2026 Aporia Films</span>
    <img src="/assets/mark-bw-96.png" alt="" width="19" height="22">
    <span>Los Angeles</span>
  </footer>
</body>
</html>
